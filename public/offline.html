<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>You're offline — HarmeLearn Academy</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: "Poppins", system-ui, -apple-system, sans-serif;
        background: linear-gradient(135deg, #eff6ff 0%, #ecfdf5 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        background: white;
        border: 1px solid #e2e8f0;
        border-radius: 24px;
        padding: 48px 40px;
        max-width: 420px;
        width: 100%;
        text-align: center;
        box-shadow: 0 20px 60px rgba(37, 99, 235, 0.12);
      }
      .logo {
        width: 64px;
        height: 64px;
        border-radius: 18px;
        background: linear-gradient(135deg, #2563eb, #10b981);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        font-size: 28px;
        font-weight: 800;
        margin: 0 auto 24px;
      }
      h1 { color: #0f172a; font-size: 22px; margin-bottom: 10px; }
      p { color: #64748b; font-size: 14px; line-height: 1.7; margin-bottom: 24px; }
      button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        margin-bottom: 10px;
      }
      button:hover { opacity: 0.92; }
      .hint { font-size: 12px; color: #94a3b8; margin-bottom: 0; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="logo">H</div>
      <h1>You're offline</h1>
      <p>
        The last pages you visited on HarmeLearn are saved on this device, so
        you can keep reviewing them. Live classes, quiz submissions and new
        content need an internet connection.
      </p>
      <button onclick="location.reload()">Retry connection</button>
      <button onclick="history.back()" style="background:#e2e8f0;color:#334155">
        Go back
      </button>
      <p class="hint">HarmeLearn Academy — study anywhere</p>
    </div>
  </body>
</html>
